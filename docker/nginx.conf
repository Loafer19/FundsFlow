events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_static on;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;

        # SPA shell: must always be revalidated, otherwise old index.html points at deleted hashed assets.
        location / {
            index  index.html;
            try_files $uri $uri/ /index.html;

            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }

        # Vite output is content-hashed, so it is safe to cache forever.
        # ^~ so the regex location below does not override this one for hashed .js/.css.
        location ^~ /assets/ {
            try_files $uri =404;

            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        # Unhashed static files (theme-init.js, favicon, robots.txt, sitemap.xml, llms.txt...): short cache.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|txt|xml|webmanifest)$ {
            try_files $uri =404;

            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
