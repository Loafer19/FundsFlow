add_header X-Content-Type-Options nosniff always;
# No X-Frame-Options: the app runs as a Telegram Mini App inside web.telegram.org; framing is governed by CSP frame-ancestors.
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; frame-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; object-src 'none'" always;
