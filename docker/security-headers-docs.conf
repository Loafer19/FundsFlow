# Security headers for the Starlight docs under /docs/.
# Same as security-headers.conf, except the CSP: Starlight inlines small scripts (theme, sidebar state)
# and the Pagefind search index runs WebAssembly, so script-src needs 'unsafe-inline' and 'wasm-unsafe-eval'.
# The docs are static and have no user data or third-party scripts.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; object-src 'none'" always;
