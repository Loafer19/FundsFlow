name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Biome
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run ci

  mcp:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Typecheck
        run: |
          cd mcp
          bun install --frozen-lockfile
          bunx tsc --noEmit -p .

  backend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, zip
          coverage: none

      - name: Pint
        run: |
          cd backend
          composer install --no-interaction --no-scripts --prefer-dist
          vendor/bin/pint --test

  release:
    needs: [frontend, mcp, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(bun -e "console.log(require('./frontend/package.json').version);")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest release version
        id: latest_release
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const response = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              return response.data.tag_name.replace('v-', '');
            } catch (error) {
              return '0.0.0';
            }
          result-encoding: string

      - name: Create Release
        if: steps.current_version.outputs.version != steps.latest_release.outputs.result
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v-${{ steps.current_version.outputs.version }}
          name: Version ${{ steps.current_version.outputs.version }}
          body: |
            Automated release for version: ${{ steps.current_version.outputs.version }}
          draft: true
          prerelease: false
