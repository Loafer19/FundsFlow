<style>
*{box-sizing:border-box}
body{margin:0;padding:10px 12px 12px;font-family:system-ui,sans-serif;color:var(--tg-theme-text-color)}
h3{margin:0 0 8px;font-size:1.05em}
.item{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 10px;border:0;border-radius:10px;background:var(--tg-theme-secondary-bg-color);color:inherit;font:inherit}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pos{color:#2e9a4c}
.neg{color:var(--tg-theme-destructive-text-color)}
.meta{color:var(--tg-theme-hint-color);font-size:.8em;margin:4px 0 0}
.empty,.err{font-size:.9em;margin:8px 0 0}
.empty{color:var(--tg-theme-hint-color)}
.err{color:var(--tg-theme-destructive-text-color)}
.actions{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.actions button{flex:1}
.actions+.actions,.files+.actions{margin-top:6px}
.hint{color:var(--tg-theme-hint-color);font-size:.85em;margin:6px 0 0}
.files{margin:6px 0 0;padding:6px 10px 10px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--tg-theme-section-separator-color,var(--tg-theme-hint-color))}
.file{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.92em}
.file+.file{border-top:1px solid var(--tg-theme-section-separator-color,rgba(127,127,127,.2))}
.fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sz{color:var(--tg-theme-hint-color);font-size:.85em}
button.sm{padding:4px 10px}
button.ic{display:flex;align-items:center;padding:4px 8px}
.files>button.o{width:100%;margin-top:8px}
button.o.on{color:var(--tg-theme-text-color)}
button.back,button.more{margin:0 0 10px}
button.back,button.more,button.o{background:transparent;color:var(--tg-theme-hint-color);box-shadow:inset 0 0 0 1px var(--tg-theme-section-separator-color,var(--tg-theme-hint-color))}
button.del{background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-destructive-text-color)}
.lines p{margin:4px 0;font-size:.95em}
.warn{margin:8px 0;font-size:.95em}
.kv{margin:8px 0 0;padding:2px 10px;border-radius:10px;background:var(--tg-theme-secondary-bg-color)}
.kv div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:.92em}
.kv div+div{border-top:1px solid var(--tg-theme-section-separator-color,rgba(127,127,127,.2))}
.kv span:first-child{color:var(--tg-theme-hint-color)}
</style>
<div id="root"></div>
<script>
const W=window.TelegramWidget;
let list=[],sel=null,ask=false,err='',okMsg='',busy=false,more=0,fo=false,lf=0,fl={},cf=0,yr={},ly=0;
function parse(s){try{return s?JSON.parse(s):null}catch(e){return null}}
function cls(a){return 'amt'+((a&&a.charAt(0)==='+')?' pos':' neg')}
function sd(df){return df?String(df).slice(0,5):''}
function note(it){return it.fn||it.n||'—'}
function more1(it){return it.gx?(' +'+it.gx):''}
function tags(it){return (it.gs&&it.gs.length)?it.gs.join(' · '):((it.g||'Untagged')+more1(it))}
function clip(it){return it.f?' · 📎':''}
function el(tag,clsName,text){const n=document.createElement(tag);if(clsName)n.className=clsName;if(text!=null)n.textContent=text;return n}
function root(){const n=document.getElementById('root');n.innerHTML='';return n}
function showList(){
  const r=root();r.appendChild(el('h3','','Recent'));
  if(err)r.appendChild(el('p','err',err));
  if(!list.length){r.appendChild(el('p','empty','No transactions yet'));return}
  list.forEach(function(it){
    const b=el('button','item');b.type='button';
    const top=el('div','top');
    top.appendChild(el('span',cls(it.a),it.a||''));
    top.appendChild(el('span','n',it.n||'—'));
    b.appendChild(top);
    b.appendChild(el('div','meta',sd(it.df)+(it.y?' · '+it.y:'')+(it.g?(' · '+it.g+more1(it)):'')+clip(it)));
    b.addEventListener('click',function(){sel=it;ask=false;fo=false;cf=0;err='';okMsg='';seen(it.id);showDetail(it)});
    r.appendChild(b);
  });
  if(more){const m=el('button','more','Load more');m.type='button';m.addEventListener('click',loadMore);r.appendChild(m)}
}
function showDetail(it){
  const r=root();
  const back=el('button','back','Back');back.type='button';
  back.addEventListener('click',function(){sel=null;ask=false;err='';okMsg='';seen(0);showList()});
  r.appendChild(back);
  r.appendChild(el('h3',cls(it.a),it.a||''));
  const box=el('div','lines');
  box.appendChild(el('p','',note(it)));
  box.appendChild(el('p','',(it.y?it.y+' · ':'')+tags(it)));
  box.appendChild(el('p','',(it.df||'')+clip(it)));
  if(err)box.appendChild(el('p','err',err));
  if(okMsg)box.appendChild(el('p','meta',okMsg));
  r.appendChild(box);
  if(it.y){const R=yr[it.id];if(!R&&!ly)loadType(it);const k=el('div','kv');if(!R)k.appendChild(el('p','hint','Loading…'));(R||[]).forEach(function(x){const d=el('div');d.appendChild(el('span','',x[0]));d.appendChild(el('span','',x[1]));k.appendChild(d)});if(!R||R.length)r.appendChild(k)}
  const act=el('div','actions');
  const edit=el('button','','Edit');edit.type='button';
  edit.addEventListener('click',function(){ask1(it,'e:','Editor opened below','Could not open the editor')});
  const del=el('button','del','Delete');del.type='button';
  del.addEventListener('click',function(){ask=true;err='';okMsg='';showConfirm(it)});
  act.appendChild(edit);act.appendChild(del);
  const n=it.f||0,fa=el('div','actions'),L=fl[it.id];
  const fb=el('button','o'+(fo?' on':''),(n?'📎 Files ('+n+')':'📎 Files')+(fo?' ▴':' ▾'));fb.type='button';
  fb.addEventListener('click',function(){fo=!fo;showDetail(it)});
  fa.appendChild(fb);r.appendChild(fa);
  if(fo){
    if(n&&!L&&!lf)loadFiles(it);
    const s=el('div','files');
    if(!n)s.appendChild(el('p','hint','No files yet'));
    else if(!L)s.appendChild(el('p','hint','Loading…'));
    (L||[]).forEach(function(f){
      const row=el('div','file');
      row.appendChild(el('span','',f.m==='i'?'🖼':'📄'));
      if(cf===f.i){
        row.appendChild(el('span','fn','Delete?'));
        row.appendChild(sm('del sm','Yes',function(){delFile(it,f)}));
        row.appendChild(sm('o sm','No',function(){cf=0;showDetail(it)}));
      }else{
        row.appendChild(el('span','fn',f.n));
        row.appendChild(el('span','sz',kb(f.s)));
        row.appendChild(sm('o sm','Send',function(){ask1(it,'g:'+f.i+':','Sent below','Could not send the file')}));
        const tb=sm('del sm ic',null,function(){cf=f.i;err='';okMsg='';showDetail(it)});tb.title='Delete';tb.setAttribute('aria-label','Delete');tb.innerHTML='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';row.appendChild(tb);
      }
      s.appendChild(row);
    });
    if(n<5)s.appendChild(btn('+ Attach','p:','Send the file below','Could not start attaching'));
    s.appendChild(el('p','hint',n<5?'Or reply to this message with a photo or file':'5 of 5 files'));
    r.appendChild(s);
  }
  r.appendChild(act);
  function btn(t,p,ok,no){const b=el('button','o',t);b.type='button';b.addEventListener('click',function(){ask1(it,p,ok,no)});return b}
}
function showConfirm(it){
  const r=root();
  const back=el('button','back','Back');back.type='button';
  back.addEventListener('click',function(){ask=false;err='';showDetail(it)});
  r.appendChild(back);
  r.appendChild(el('h3','','Delete this transaction?'));
  r.appendChild(el('p','warn',(it.a||'')+' · '+note(it)));
  if(err)r.appendChild(el('p','err',err));
  const act=el('div','actions');
  const yes=el('button','','Delete');yes.type='button';
  yes.addEventListener('click',function(){doDelete(it)});
  const no=el('button','','Cancel');no.type='button';
  no.addEventListener('click',function(){ask=false;err='';showDetail(it)});
  act.appendChild(yes);act.appendChild(no);r.appendChild(act);
}
function kb(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function loadFiles(it){lf=1;askBot('l:'+it.id).then(function(r){lf=0;fl[it.id]=(r&&r.ok&&r.l)||[];if(!(r&&r.ok))err=(r&&r.e)||'Could not load files';showDetail(sel||it)},function(e){lf=0;fl[it.id]=[];err=(e&&e.code)||'Could not load files';showDetail(sel||it)})}
function loadType(it){ly=1;askBot('y:'+it.id).then(function(r){ly=0;yr[it.id]=(r&&r.ok&&r.r)||[];showDetail(sel||it)},function(){ly=0;yr[it.id]=[];showDetail(sel||it)})}
function sm(c,t,fn){const b=el('button',c,t);b.type='button';b.addEventListener('click',fn);return b}
function delFile(it,f){
  if(busy)return;busy=true;err='';okMsg='';
  askBot('k:'+f.i+':'+it.id).then(function(r){
    busy=false;cf=0;
    if(r&&r.ok){fl[it.id]=r.l||[];it.f=fl[it.id].length;list.forEach(function(x){if(x.id===it.id)x.f=it.f});okMsg='File deleted'}else err=(r&&r.e)||'Could not delete the file';
    showDetail(it);
  },function(e){busy=false;cf=0;err=(e&&e.code)||'Could not delete the file';showDetail(it)});
}
function seen(id){askBot('v:'+id).catch(function(){})}
function askBot(q){
  if(!W||!W.request)return Promise.reject({code:'Send this in Telegram'});
  return W.request(q).then(function(a){return parse(a&&a.result)||{}})
}
function ask1(it,p,done,fail){
  if(busy)return;busy=true;err='';okMsg='';showDetail(it);
  askBot(p+it.id).then(function(r){
    busy=false;
    if(r&&r.ok){okMsg=done;showDetail(it);if(W.HapticFeedback&&W.HapticFeedback.notificationOccurred)W.HapticFeedback.notificationOccurred('success');return}
    err=(r&&r.e)||fail;showDetail(it);
  },function(e){busy=false;err=(e&&e.code)||fail;showDetail(it)});
}
function doDelete(it){
  if(busy)return;busy=true;err='';showConfirm(it);
  askBot('x:'+it.id).then(function(r){
    busy=false;
    if(r&&r.ok){
      list=list.filter(function(x){return x.id!==it.id});
      sel=null;ask=false;err='';
      if(W.HapticFeedback&&W.HapticFeedback.notificationOccurred)W.HapticFeedback.notificationOccurred('success');
      showList();return;
    }
    err=(r&&r.e)||'Could not delete';showConfirm(it);
  },function(e){busy=false;err=(e&&e.code)||'Could not delete';showConfirm(it)});
}
function loadMore(){
  if(busy)return;busy=true;err='';showList();
  askBot('m:'+list.length).then(function(r){
    busy=false;
    if(r&&r.ok){list=list.concat(r.i||[]);more=r.more||0;err='';showList();return}
    err=(r&&r.e)||'Could not load more';showList();
  },function(e){busy=false;err=(e&&e.code)||'Could not load more';showList()});
}
function render(){
  const d=parse(W&&W.chatData)||{};
  list=d.i||[];more=d.more||0;yr={};
  if(sel){
    const fresh=list.filter(function(x){return x.id===sel.id})[0];
    if(!fresh){sel=null;ask=false;showList();return}
    if((fresh.f||0)!==(sel.f||0))delete fl[sel.id];
    sel=Object.assign({},sel,fresh,{f:fresh.f||0});
    if(ask)showConfirm(sel);else showDetail(sel);return;
  }
  showList();
}
if(W&&W.onEvent)W.onEvent('chatDataChanged',render);
if(W&&W.ready)W.ready();
render();
</script>
