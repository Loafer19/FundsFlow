<style>
*{box-sizing:border-box}
body{margin:0;padding:10px 12px 12px;font-family:system-ui,sans-serif;color:var(--tg-theme-text-color)}
.amt{font-size:1.6em;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:0 0 8px;min-height:1.3em}
.toggle{display:flex;gap:6px;margin:0 0 8px}
.sw{flex:1;background:transparent;color:var(--tg-theme-hint-color);box-shadow:inset 0 0 0 1px var(--tg-theme-section-separator-color,var(--tg-theme-hint-color))}
.sw.ex.on{background:var(--tg-theme-destructive-text-color,#e53935);color:#fff;box-shadow:none}
.sw.in.on{background:#2e9a4c;color:#fff;box-shadow:none}
.amt.ex{color:var(--tg-theme-destructive-text-color,#e53935)}
.amt.in{color:#2e9a4c}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 8px}
.pad button{padding:11px 0;font-size:1.15em;font-weight:650}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tags button{padding:6px 8px;font-size:.85em;background:transparent;color:var(--tg-theme-hint-color);box-shadow:inset 0 0 0 1px var(--tg-theme-section-separator-color,var(--tg-theme-hint-color))}
.tags button.on{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color);box-shadow:none}
.add{display:block;width:100%}
.st{min-height:1.2em;margin:8px 0 0;font-size:.85em;text-align:center;color:var(--tg-theme-hint-color)}
.st.ok{color:var(--tg-theme-accent-text-color)}
.st.err{color:var(--tg-theme-destructive-text-color)}
</style>
<div class="amt" id="amt">0</div>
<div class="toggle">
<button type="button" id="ex" class="sw ex on" aria-pressed="true">Expense</button>
<button type="button" id="in" class="sw in" aria-pressed="false">Income</button>
</div>
<div class="pad" id="pad"></div>
<div class="tags" id="tags"></div>
<button type="button" class="add" id="go">Add</button>
<p class="st" id="st"></p>
<script>
const W=window.TelegramWidget;
let raw='',inc=false,tag=null,busy=false;
function parse(s){try{return s?JSON.parse(s):null}catch(e){return null}}
function signed(){const n=raw||'0';return (inc?'+':'-')+n}
function showAmt(){const a=document.getElementById('amt');a.textContent=raw?signed():'0';a.className='amt '+(inc?'in':'ex')}
function setInc(v){inc=v;['ex','in'].forEach(function(id){const b=document.getElementById(id),on=(id==='in')===inc;b.className='sw '+id+(on?' on':'');b.setAttribute('aria-pressed',on?'true':'false')});showAmt();renderTags()}
function setSt(kind,text){const el=document.getElementById('st');el.className='st'+(kind?' '+kind:'');el.textContent=text||''}
function tagList(){
  const d=parse(W&&W.chatData)||{};
  const keyed=inc?d.i:d.e;
  return (keyed&&keyed.length)?keyed:(d.tags||[])
}
function renderTags(){
  const box=document.getElementById('tags');box.innerHTML='';
  const list=tagList();
  if(tag&&!list.some(function(t){return t.id===tag}))tag=null;
  const d=parse(W&&W.chatData)||{};
  list.forEach(function(t){
    const b=document.createElement('button');b.type='button';
    b.textContent=t.n+(tag===t.id?' ✓':'');if(tag===t.id)b.className='on';b.setAttribute('aria-pressed',tag===t.id?'true':'false');
    b.addEventListener('click',function(){tag=(tag===t.id)?null:t.id;renderTags()});
    box.appendChild(b);
  });
  if(d.last&&d.last.a&&!busy)setSt('ok','Last added: '+(d.last.a)+(d.last.n?(' · '+d.last.n):''));
}
function key(k){
  if(k==='←'||k==='⌫'){raw=raw.slice(0,-1);showAmt();return}
  if(k==='.'){if(raw.indexOf('.')!==-1)return;raw=raw?raw+'.':'0.';showAmt();return}
  if(raw==='0')raw='';
  if(raw.indexOf('.')!==-1&&raw.split('.')[1].length>=2)return;
  if(raw.replace('.','').length>=10)return;
  raw+=k;showAmt();
}
(function(){
  const pad=document.getElementById('pad');
  ['1','2','3','4','5','6','7','8','9','.','0','←'].forEach(function(k){
    const b=document.createElement('button');b.type='button';b.textContent=k;
    b.addEventListener('click',function(){key(k)});
    pad.appendChild(b);
  });
  document.getElementById('ex').addEventListener('click',function(){setInc(false)});
  document.getElementById('in').addEventListener('click',function(){setInc(true)});
  document.getElementById('go').addEventListener('click',function(){
    if(busy)return;
    if(!raw||raw==='0'||raw==='0.'){setSt('err',"Amount can't be zero");return}
    const q='a:'+signed()+(tag?(':'+tag):'');
    if(!W||!W.request){setSt('err','Send this in Telegram');return}
    busy=true;setSt('','Sending…');
    W.request(q).then(function(a){
      busy=false;
      const r=parse(a&&a.result);
      if(r&&r.ok){
        raw='';showAmt();
        setSt('ok','Added '+(r.a||'')+(r.n?(' · '+r.n):''));
        if(W.HapticFeedback&&W.HapticFeedback.notificationOccurred)W.HapticFeedback.notificationOccurred('success');
        return;
      }
      setSt('err',(r&&r.e)||'Could not add');
    },function(e){busy=false;setSt('err',(e&&e.code)||'Could not add')});
  });
})();
if(W&&W.onEvent)W.onEvent('chatDataChanged',renderTags);
if(W&&W.ready)W.ready();
showAmt();renderTags();
</script>
