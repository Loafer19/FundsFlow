<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FundsFlow — Personal Finance Tracker</title>
    <meta name="description"
        content="Track spending with tags, budgets, recurring payments, and a Telegram bot. Charts for balance, money flow, and tag distribution — private personal finance in one place.">
    <meta name="theme-color" content="#f5d0a9">
    <link rel="canonical" href="https://fundsflow.fun/">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FundsFlow">
    <meta property="og:url" content="https://fundsflow.fun/">
    <meta property="og:title" content="FundsFlow — Personal Finance Tracker">
    <meta property="og:description"
        content="Track spending with tags, budgets, recurring payments, and a Telegram bot. Charts for balance, money flow, and tag distribution.">
    <meta property="og:image" content="https://fundsflow.fun/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="FundsFlow — personal finance tracker">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FundsFlow — Personal Finance Tracker">
    <meta name="twitter:description"
        content="Track spending with tags, budgets, recurring payments, and a Telegram bot.">
    <meta name="twitter:image" content="https://fundsflow.fun/og.png">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FundsFlow",
        "url": "https://fundsflow.fun/",
        "description": "Personal finance tracker with tags, budgets, recurring payments, Telegram bot, and analytics.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        }
    }
    </script>

    <link rel="preconnect" href="%VITE_API_URL%" crossorigin>

    <!-- defer keeps the order (SDK before main.js) without blocking HTML parsing on telegram.org. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script type="module" src="/src/main.js"></script>
    <!-- Inline so the theme is set before first paint without a render-blocking request.
         The CSP allows it by hash, computed at image build time (docker/csp-hashes.mjs). -->
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'bumblebee')</script>
</head>

<body class="bg-base-200">

</body>

</html>
