<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1625 0%, #2d2438 45%, #3d2f1f 100%);
            color: #fff8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 1080px;
            height: 510px;
            border-radius: 28px;
            background: linear-gradient(160deg, rgba(255, 244, 230, 0.12), rgba(255, 200, 120, 0.08));
            border: 1px solid rgba(255, 220, 170, 0.28);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            gap: 48px;
            padding: 56px 64px;
        }
        .logo {
            width: 220px;
            height: 220px;
            border-radius: 40px;
            flex-shrink: 0;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }
        .copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        h1 {
            font-size: 92px;
            line-height: 1;
            letter-spacing: -0.03em;
            font-weight: 800;
            color: #ffe6c2;
        }
        p {
            font-size: 34px;
            line-height: 1.35;
            color: rgba(255, 248, 240, 0.82);
            max-width: 640px;
        }
        .url {
            margin-top: 8px;
            font-size: 26px;
            color: rgba(255, 210, 140, 0.9);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="../public/logo.png" alt="FundsFlow">
        <div class="copy">
            <h1>FundsFlow</h1>
            <p>Personal finance tracker — tags, budgets, recurring payments, Telegram bot</p>
            <div class="url">fundsflow.fun</div>
        </div>
    </div>
</body>
</html>
